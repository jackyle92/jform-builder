<template>
    <div class="st">
        <nav class="st-nav" aria-label="Settings sections">
            <template for:each={navItems} for:item="item">
                <button key={item.id} type="button" class={item.cls} aria-current={item.current} data-section={item.id} onclick={handleSection}>
                    <lightning-icon class="st-nav-icon" icon-name={item.icon} size="x-small"></lightning-icon>
                    <span class="st-nav-text">
                        <span class="st-nav-label">{item.label}</span>
                        <span class="st-nav-summary">{item.summary}</span>
                    </span>
                    <template lwc:if={item.attention}>
                        <span class="st-nav-dot" title={item.attention}><span class="slds-assistive-text">{item.attention}</span></span>
                    </template>
                </button>
            </template>
        </nav>

        <section class="st-panel" aria-label={active.label}>
            <header class="st-head">
                <h2 class="st-title">{active.label}</h2>
                <p class="st-muted">{active.description}</p>
            </header>

            <!-- General -->
            <template lwc:if={isGeneral}>
                <div class="st-row">
                    <div class="st-row-text">
                        <p class="st-row-label">Internal name</p>
                        <p class="st-row-help">Shown in your form list and reports. Respondents never see it.</p>
                    </div>
                    <div class="st-row-control">
                        <lightning-input label="Internal name" variant="label-hidden" value={definition.name} data-prop="name" onchange={handleText} max-length="80"></lightning-input>
                    </div>
                </div>
                <div class="st-row">
                    <div class="st-row-text">
                        <p class="st-row-label">Public title</p>
                        <p class="st-row-help">The heading respondents see at the top of the form.</p>
                    </div>
                    <div class="st-row-control">
                        <lightning-input label="Public title" variant="label-hidden" value={definition.label} data-prop="label" onchange={handleText}></lightning-input>
                    </div>
                </div>
                <div class="st-row">
                    <div class="st-row-text">
                        <p class="st-row-label">Description</p>
                        <p class="st-row-help">A line or two under the title.</p>
                    </div>
                    <div class="st-row-control">
                        <lightning-textarea label="Description" variant="label-hidden" value={definition.description} data-prop="description" onchange={handleText}></lightning-textarea>
                    </div>
                </div>
                <div class="st-row">
                    <div class="st-row-text">
                        <p class="st-row-label">Pages</p>
                        <p class="st-row-help">How respondents move through the form. Each section on the Build tab can be its own page.</p>
                    </div>
                    <div class="st-row-control">
                        <div class="st-layouts" role="radiogroup" aria-label="Pages">
                            <template for:each={layoutChoices} for:item="c">
                                <button key={c.value} type="button" role="radio" aria-checked={c.checked} tabindex={c.tabindex} class={c.cls} data-value={c.value} onclick={handleLayoutPick} onkeydown={handleLayoutKey}>
                                    <span class="st-layout-art">
                                        <template lwc:if={c.isSingle}>
                                            <!-- one tall page that scrolls: title, four questions, submit -->
                                            <svg viewBox="0 0 160 110" aria-hidden="true" focusable="false">
                                                <rect class="art-page" x="50" y="6" width="60" height="98" rx="5"></rect>
                                                <rect class="art-scroll" x="105" y="12" width="2" height="34" rx="1"></rect>
                                                <rect class="art-ink" x="57" y="14" width="30" height="5" rx="2"></rect>
                                                <rect class="art-line" x="57" y="22" width="40" height="3" rx="1.5"></rect>
                                                <rect class="art-line" x="57" y="32" width="16" height="2.5" rx="1.25"></rect>
                                                <rect class="art-input" x="57" y="36" width="44" height="6" rx="2"></rect>
                                                <rect class="art-line" x="57" y="46" width="20" height="2.5" rx="1.25"></rect>
                                                <rect class="art-input" x="57" y="50" width="44" height="6" rx="2"></rect>
                                                <rect class="art-line" x="57" y="60" width="14" height="2.5" rx="1.25"></rect>
                                                <rect class="art-input" x="57" y="64" width="44" height="6" rx="2"></rect>
                                                <rect class="art-line" x="57" y="74" width="18" height="2.5" rx="1.25"></rect>
                                                <rect class="art-input" x="57" y="78" width="44" height="6" rx="2"></rect>
                                                <rect class="art-button" x="57" y="91" width="22" height="7" rx="3.5"></rect>
                                            </svg>
                                        </template>
                                        <template lwc:else>
                                            <!-- stacked pages: progress, title, two questions, Back and Next -->
                                            <svg viewBox="0 0 160 110" aria-hidden="true" focusable="false">
                                                <rect class="art-page art-back-2" x="62" y="6" width="58" height="80" rx="5"></rect>
                                                <rect class="art-page art-back-1" x="51" y="13" width="58" height="80" rx="5"></rect>
                                                <rect class="art-page" x="40" y="20" width="58" height="84" rx="5"></rect>
                                                <rect class="art-accent" x="47" y="27" width="13" height="3" rx="1.5"></rect>
                                                <rect class="art-line" x="62" y="27" width="13" height="3" rx="1.5"></rect>
                                                <rect class="art-line" x="77" y="27" width="13" height="3" rx="1.5"></rect>
                                                <rect class="art-ink" x="47" y="36" width="26" height="5" rx="2"></rect>
                                                <rect class="art-line" x="47" y="47" width="16" height="2.5" rx="1.25"></rect>
                                                <rect class="art-input" x="47" y="51" width="43" height="6" rx="2"></rect>
                                                <rect class="art-line" x="47" y="61" width="20" height="2.5" rx="1.25"></rect>
                                                <rect class="art-input" x="47" y="65" width="43" height="6" rx="2"></rect>
                                                <rect class="art-outline" x="47" y="89" width="17" height="7" rx="3.5"></rect>
                                                <rect class="art-button" x="73" y="89" width="17" height="7" rx="3.5"></rect>
                                            </svg>
                                        </template>
                                        <template lwc:if={c.selected}>
                                            <span class="st-layout-check"><lightning-icon icon-name="utility:check" size="xx-small" variant="inverse"></lightning-icon></span>
                                        </template>
                                    </span>
                                    <span class="st-layout-title">{c.title}</span>
                                    <span class="st-layout-text">{c.text}</span>
                                </button>
                            </template>
                        </div>
                    </div>
                </div>
            </template>

            <!-- Availability -->
            <template lwc:if={isAvailability}>
                <template lwc:if={closedNotice}>
                    <p class="st-notice">{closedNotice}</p>
                </template>
                <div class="st-row">
                    <div class="st-row-text">
                        <p class="st-row-label">Status</p>
                        <p class="st-row-help">Respondents always see the last published version. Keep editing; publish when the draft is ready.</p>
                    </div>
                    <div class="st-row-control st-row-value">
                        <span class={statusClass}>{statusShort}</span>
                        <span class="st-value-text">{statusText}</span>
                    </div>
                </div>
                <div class="st-row">
                    <div class="st-row-text">
                        <p class="st-row-label">Public key</p>
                        <p class="st-row-help">Identifies the form in its public link and embed code.</p>
                    </div>
                    <div class="st-row-control st-row-value">
                        <code class="st-key">{publicKey}</code>
                    </div>
                </div>
                <template lwc:if={notOpenNotice}>
                    <p class="st-notice">{notOpenNotice}</p>
                </template>
                <div class="st-row">
                    <div class="st-row-text">
                        <p class="st-row-label">Opens</p>
                        <p class="st-row-help">Before this time respondents see the not-yet-open screen. Leave empty to open once the form is published.</p>
                    </div>
                    <div class="st-row-control">
                        <lightning-input type="datetime" label="Opens" variant="label-hidden" value={access.openAt} timezone={zone} data-prop="openAt" onchange={handleMoment}></lightning-input>
                    </div>
                </div>
                <div class="st-row">
                    <div class="st-row-text">
                        <p class="st-row-label">Closes</p>
                        <p class="st-row-help">From this time respondents see the closed screen. Leave empty to keep the form open.</p>
                        <template lwc:if={olderCloseNote}>
                            <p class="st-row-help">{olderCloseNote}</p>
                            <lightning-button variant="base" label="Remove the last day" class="st-clear-day" onclick={handleClearCloseDay}></lightning-button>
                        </template>
                    </div>
                    <div class="st-row-control">
                        <lightning-input type="datetime" label="Closes" variant="label-hidden" value={access.closeAt} timezone={zone} data-prop="closeAt" onchange={handleMoment}></lightning-input>
                    </div>
                </div>
                <div class="st-row">
                    <div class="st-row-text">
                        <p class="st-row-label">Time zone</p>
                        <p class="st-row-help">Opens and Closes are in this time zone, and respondents read the opening time in it.</p>
                    </div>
                    <div class="st-row-control">
                        <lightning-combobox label="Time zone" variant="label-hidden" options={zoneOptions} value={zone} data-prop="timeZone" onchange={handleZone}></lightning-combobox>
                    </div>
                </div>
                <div class="st-row">
                    <div class="st-row-text">
                        <p class="st-row-label">Maximum responses</p>
                        <p class="st-row-help">The form closes once this many responses are in. Spam is not counted.</p>
                    </div>
                    <div class="st-row-control">
                        <lightning-input type="number" label="Maximum responses" variant="label-hidden" value={access.responseLimit} min="1" placeholder="No limit" data-prop="responseLimit" onchange={handleAccessText}></lightning-input>
                    </div>
                </div>
                <h3 class="st-group">Before it opens</h3>
                <p class="st-group-help">Shown instead of the form until it opens, with the opening time under the message. Respondents can't see the questions yet.</p>
                <div class="st-row">
                    <div class="st-row-text">
                        <p class="st-row-label">Title</p>
                        <p class="st-row-help">Leave empty to show the form's title.</p>
                    </div>
                    <div class="st-row-control">
                        <lightning-input label="Before it opens title" variant="label-hidden" value={notOpenScreen.title} placeholder="This form isn't open yet" max-length="120"
                            data-screen="notOpen" data-prop="title" onchange={handleScreen}></lightning-input>
                    </div>
                </div>
                <div class="st-row st-row-stack">
                    <div class="st-row-text">
                        <p class="st-row-label">Message</p>
                        <p class="st-row-help">Shown above the opening time.</p>
                    </div>
                    <div class="st-row-control">
                        <c-jform-rich-editor label="Before it opens message" name="notOpenMessage" data-screen="notOpen" data-prop="message" value={notOpenScreen.message} mode={notOpenEditorMode}
                            onchange={handleScreen} onmodechange={handleScreenMode}></c-jform-rich-editor>
                    </div>
                </div>
                <div class="st-row">
                    <div class="st-row-text">
                        <p class="st-row-label">Image</p>
                        <p class="st-row-help">An https link or a path on your site. Leave empty to use the design's cover image.</p>
                    </div>
                    <div class="st-row-control">
                        <lightning-input type="url" label="Before it opens image" variant="label-hidden" value={notOpenScreen.imageUrl} placeholder="https://"
                            data-screen="notOpen" data-prop="imageUrl" onchange={handleScreen}></lightning-input>
                    </div>
                </div>
                <h3 class="st-group">After it closes</h3>
                <p class="st-group-help">Shown instead of the form once it closes or has its maximum responses.</p>
                <div class="st-row">
                    <div class="st-row-text">
                        <p class="st-row-label">Title</p>
                        <p class="st-row-help">Leave empty to show the form's title.</p>
                    </div>
                    <div class="st-row-control">
                        <lightning-input label="After it closes title" variant="label-hidden" value={closedScreen.title} placeholder="This form is closed" max-length="120"
                            data-screen="closed" data-prop="title" onchange={handleScreen}></lightning-input>
                    </div>
                </div>
                <div class="st-row st-row-stack">
                    <div class="st-row-text">
                        <p class="st-row-label">Message</p>
                        <p class="st-row-help">Leave empty for “This form is no longer accepting responses.”</p>
                    </div>
                    <div class="st-row-control">
                        <c-jform-rich-editor label="After it closes message" name="closedMessage" data-screen="closed" data-prop="message" value={closedScreen.message} mode={closedEditorMode}
                            onchange={handleScreen} onmodechange={handleScreenMode}></c-jform-rich-editor>
                    </div>
                </div>
                <div class="st-row">
                    <div class="st-row-text">
                        <p class="st-row-label">Image</p>
                        <p class="st-row-help">An https link or a path on your site. Leave empty to use the design's cover image.</p>
                    </div>
                    <div class="st-row-control">
                        <lightning-input type="url" label="After it closes image" variant="label-hidden" value={closedScreen.imageUrl} placeholder="https://"
                            data-screen="closed" data-prop="imageUrl" onchange={handleScreen}></lightning-input>
                    </div>
                </div>
            </template>
            <!-- Messages and buttons -->
            <template lwc:if={isMessages}>
                <h3 class="st-group">Welcome and thank-you screens</h3>
                <div class="st-row">
                    <div class="st-row-text">
                        <p class="st-row-label">Welcome screen</p>
                        <p class="st-row-help">{welcomeSummary}</p>
                    </div>
                    <div class="st-row-control">
                        <lightning-button label="Edit the welcome screen" icon-name="utility:forward" icon-position="right" data-select="welcome" onclick={handleOpenScreen}></lightning-button>
                    </div>
                </div>
                <div class="st-row">
                    <div class="st-row-text">
                        <p class="st-row-label">Thank-you screen</p>
                        <p class="st-row-help">{endingSummary}</p>
                    </div>
                    <div class="st-row-control">
                        <lightning-button label="Edit the thank-you screen" icon-name="utility:forward" icon-position="right" data-select="ending" onclick={handleOpenScreen}></lightning-button>
                    </div>
                </div>
                <h3 class="st-group">Buttons</h3>
                <p class="st-group-help">Leave a box empty to keep the standard word. Where the buttons sit and how big they are is set on the Design tab.</p>
                <div class="st-row">
                    <div class="st-row-text">
                        <p class="st-row-label">Submit button</p>
                        <p class="st-row-help">Sends the response, on the last page.</p>
                    </div>
                    <div class="st-row-control">
                        <lightning-input label="Submit button" variant="label-hidden" placeholder="Submit" value={buttonText.submit} max-length="40" data-key="submit" onchange={handleButtonText}></lightning-input>
                    </div>
                </div>
                <div class="st-row">
                    <div class="st-row-text">
                        <p class="st-row-label">Next button</p>
                        <p class="st-row-help">Moves to the next page.{pagedButtonsHelp}</p>
                    </div>
                    <div class="st-row-control">
                        <lightning-input label="Next button" variant="label-hidden" placeholder="Next" value={buttonText.next} max-length="40" data-key="next" onchange={handleButtonText}></lightning-input>
                    </div>
                </div>
                <div class="st-row">
                    <div class="st-row-text">
                        <p class="st-row-label">Back button</p>
                        <p class="st-row-help">Returns to the previous page.{pagedButtonsHelp}</p>
                    </div>
                    <div class="st-row-control">
                        <lightning-input label="Back button" variant="label-hidden" placeholder="Back" value={buttonText.back} max-length="40" data-key="back" onchange={handleButtonText}></lightning-input>
                    </div>
                </div>
            </template>

            <!-- Responses -->
            <template lwc:if={isResponses}>
                <div class="st-row">
                    <div class="st-row-text">
                        <p class="st-row-label">Record steps</p>
                        <template lwc:if={hasSteps}>
                            <p class="st-row-help">Each response runs {stepCountText} from the Automate tab{mainRecordText}.</p>
                        </template>
                        <template lwc:else>
                            <p class="st-row-help">Responses are stored on the Responses tab only. Add record steps on the Automate tab to create or update records.</p>
                        </template>
                    </div>
                    <div class="st-row-control st-row-value">
                        <lightning-button label="Open the Automate tab" icon-name="utility:forward" icon-position="right" data-action="automate" onclick={handleOpenAutomate}></lightning-button>
                    </div>
                </div>
                <div class="st-row st-row-stack">
                    <p class="st-row-label">Quick mapping</p>
                    <p class="st-row-help">Pick an object under "Saves to" on a field in the Build tab to map that field to the main record without opening the Automate tab.</p>
                </div>
                <div class="st-row st-row-stack">
                    <p class="st-row-label">When a step fails</p>
                    <p class="st-row-help">The answers are still stored, and the response is flagged on the Responses tab, where it can be retried after a fix.</p>
                </div>
            </template>

            <!-- Spam protection -->
            <template lwc:if={isSpam}>
                <div class="st-row">
                    <div class="st-row-text">
                        <p class="st-row-label">Protect this form from spam</p>
                        <p class="st-row-help">Responses that arrive faster than a person could type, repeat the same answers, carry too many links or blocked words, or fill the hidden field are stored under the Spam filter on the Responses tab. They never create records. The hidden field is always on.</p>
                    </div>
                    <div class="st-row-control st-row-value">
                        <lightning-input type="toggle" label="Protect this form from spam" variant="label-hidden" message-toggle-active="On" message-toggle-inactive="Off" checked={protection.enabled} data-prop="enabled" onchange={handleProtectionToggle}></lightning-input>
                    </div>
                </div>
                <template lwc:if={protection.enabled}>
                    <template lwc:if={signingHint}><p class="st-notice">{signingHint}</p></template>
                    <div class="st-row">
                        <div class="st-row-text">
                            <p class="st-row-label">Google reCAPTCHA v3</p>
                            <p class="st-row-help">{captchaHint}</p>
                        </div>
                        <div class="st-row-control st-row-value">
                            <lightning-input type="toggle" label="Verify respondents with Google reCAPTCHA v3" variant="label-hidden" message-toggle-active="On" message-toggle-inactive="Off" checked={protection.captcha} disabled={captchaDisabled} data-prop="captcha" onchange={handleProtectionToggle}></lightning-input>
                        </div>
                    </div>
                    <div class="st-advanced">
                        <button type="button" class="st-advanced-toggle" aria-expanded={advancedExpanded} onclick={handleAdvancedToggle}>
                            <lightning-icon icon-name={advancedIcon} size="xx-small"></lightning-icon>
                            <span class="st-advanced-label">Advanced settings</span>
                            <span class="st-advanced-state">{advancedState}</span>
                        </button>
                        <template lwc:if={hasAdvancedChanges}>
                            <lightning-button variant="base" label="Reset to defaults" data-action="reset-advanced" onclick={handleAdvancedReset}></lightning-button>
                        </template>
                    </div>
                    <template lwc:if={advancedOpen}>
                        <p class="st-group-help">Each check that fires adds points to a response; at 50 points it is stored as spam. Too fast, repeated answers and blocked words reach that on their own.</p>
                        <div class="st-row">
                            <div class="st-row-text">
                                <p class="st-row-label">Minimum seconds to fill in</p>
                                <p class="st-row-help">Faster responses count as spam. 0 turns the check off.</p>
                            </div>
                            <div class="st-row-control">
                                <lightning-input type="number" label="Minimum seconds to fill in" variant="label-hidden" value={protection.minSeconds} min="0" max="600" data-prop="minSeconds" onchange={handleProtectionText}></lightning-input>
                            </div>
                        </div>
                        <div class="st-row">
                            <div class="st-row-text">
                                <p class="st-row-label">Maximum responses per minute</p>
                                <p class="st-row-help">Counted for the whole form, not per visitor. Going over adds to the spam score. 0 turns the check off.</p>
                            </div>
                            <div class="st-row-control">
                                <lightning-input type="number" label="Maximum responses per minute" variant="label-hidden" value={protection.perMinute} min="0" max="10000" data-prop="perMinute" onchange={handleProtectionText}></lightning-input>
                            </div>
                        </div>
                        <div class="st-row">
                            <div class="st-row-text">
                                <p class="st-row-label">Maximum links in the answers</p>
                                <p class="st-row-help">More links than this in free-text answers adds to the spam score.</p>
                            </div>
                            <div class="st-row-control">
                                <lightning-input type="number" label="Maximum links in the answers" variant="label-hidden" value={protection.maxLinks} min="0" max="100" data-prop="maxLinks" onchange={handleProtectionText}></lightning-input>
                            </div>
                        </div>
                        <div class="st-row">
                            <div class="st-row-text">
                                <p class="st-row-label">Repeated answers window (minutes)</p>
                                <p class="st-row-help">The same answers sent again within this time count as spam. 0 turns the check off.</p>
                            </div>
                            <div class="st-row-control">
                                <lightning-input type="number" label="Repeated answers window in minutes" variant="label-hidden" value={protection.duplicateMinutes} min="0" max="1440" data-prop="duplicateMinutes" onchange={handleProtectionText}></lightning-input>
                            </div>
                        </div>
                        <div class="st-row">
                            <div class="st-row-text">
                                <p class="st-row-label">Blocked words</p>
                                <p class="st-row-help">One per line or comma separated. Responses that contain any of them count as spam.</p>
                            </div>
                            <div class="st-row-control">
                                <lightning-textarea label="Blocked words" variant="label-hidden" value={protection.blockedWords} data-prop="blockedWords" onchange={handleProtectionText}></lightning-textarea>
                            </div>
                        </div>
                    </template>
                </template>
            </template>

            <!-- Payments -->
            <template lwc:if={isPayments}>
                <template lwc:if={hasPaymentBlock}>
                    <template lwc:if={paymentsNotice}><p class="st-notice">{paymentsNotice}</p></template>
                </template>
                <template lwc:else>
                    <p class="st-notice">These settings apply once the form has a Payment block. Add one from the Advanced fields on the Build tab.</p>
                </template>
                <div class="st-row">
                    <div class="st-row-text">
                        <p class="st-row-label">Payment gateway</p>
                        <p class="st-row-help">Who takes the payment. Each gateway uses the keys an admin saved on the JForm Setup tab. The Payment block's properties show the same choice.</p>
                    </div>
                    <div class="st-row-control">
                        <c-jform-gateway-picker label="Payment gateway" options={gatewayOptions} value={payments.gateway} onchange={handleGateway}></c-jform-gateway-picker>
                    </div>
                </div>
                <div class="st-row">
                    <div class="st-row-text">
                        <p class="st-row-label">Payments</p>
                        <p class="st-row-help">{paymentModeHelp}</p>
                    </div>
                    <div class="st-row-control">
                        <lightning-combobox label="Payments" variant="label-hidden" options={paymentModeOptions} value={payments.mode} data-prop="mode" onchange={handlePaymentChoice}></lightning-combobox>
                    </div>
                </div>
                <div class="st-row">
                    <div class="st-row-text">
                        <p class="st-row-label">Currency</p>
                        <p class="st-row-help">{currencyHelp}</p>
                    </div>
                    <div class="st-row-control">
                        <lightning-combobox label="Currency" variant="label-hidden" options={currencyOptions} value={payments.currency} data-prop="currency" onchange={handlePaymentChoice}></lightning-combobox>
                    </div>
                </div>
                <template lwc:if={showPaymentWindow}>
                    <div class="st-row">
                        <div class="st-row-text">
                            <p class="st-row-label">Where respondents pay</p>
                            <p class="st-row-help">{paymentWindowHelp}</p>
                        </div>
                        <div class="st-row-control">
                            <lightning-combobox label="Where respondents pay" variant="label-hidden" options={paymentWindowOptions} value={payments.openIn} data-prop="openIn" onchange={handlePaymentChoice}></lightning-combobox>
                        </div>
                    </div>
                </template>
                <template lwc:if={showEmailField}>
                    <div class="st-row">
                        <div class="st-row-text">
                            <p class="st-row-label">Email on the payment page</p>
                            <p class="st-row-help">{emailFieldHelp}</p>
                        </div>
                        <div class="st-row-control">
                            <lightning-combobox label="Email on the payment page" variant="label-hidden" options={emailFieldOptions} value={emailFieldValue} data-prop="emailField" onchange={handleEmailField}></lightning-combobox>
                        </div>
                    </div>
                </template>
                <div class="st-row">
                    <div class="st-row-text">
                        <p class="st-row-label">Always ask for a billing address</p>
                        <p class="st-row-help">{billingAddressHelp}</p>
                    </div>
                    <div class="st-row-control st-row-value">
                        <lightning-input type="toggle" label="Always ask for a billing address" variant="label-hidden" message-toggle-active="On" message-toggle-inactive="Off" checked={payments.askBillingAddress} data-prop="askBillingAddress" onchange={handleBillingAddress}></lightning-input>
                    </div>
                </div>
                <div class="st-row">
                    <div class="st-row-text">
                        <p class="st-row-label">Promotion codes</p>
                        <p class="st-row-help">{codesHelp}</p>
                        <template lwc:if={codesLimits.length}>
                            <ul class="st-row-list">
                                <template for:each={codesLimits} for:item="limit"><li key={limit}>{limit}</li></template>
                            </ul>
                        </template>
                    </div>
                    <div class="st-row-control">
                        <lightning-combobox label="Promotion codes" variant="label-hidden" options={codeOptions} value={payments.codes} disabled={codesDisabled} data-prop="codes" onchange={handleCodes}></lightning-combobox>
                    </div>
                </div>
                <template lwc:if={showCodeList}>
                    <c-jform-promotion-codes form-id={formId} currency={payments.currency}></c-jform-promotion-codes>
                </template>
                <div class="st-row">
                    <div class="st-row-text">
                        <p class="st-row-label">Run record steps for test payments</p>
                        <p class="st-row-help">Record steps and flows run once a response is paid. Turn this off to keep test payments from creating records.</p>
                    </div>
                    <div class="st-row-control st-row-value">
                        <lightning-input type="toggle" label="Run record steps for test payments" variant="label-hidden" message-toggle-active="On" message-toggle-inactive="Off" checked={testStepsOn} data-prop="testSteps" onchange={handleTestSteps}></lightning-input>
                    </div>
                </div>
            </template>
        </section>
    </div>
</template>
