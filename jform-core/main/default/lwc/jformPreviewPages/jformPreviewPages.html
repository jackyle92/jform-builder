<template>
    <div class="pp">
        <template lwc:if={showPicker}>
            <div class="pp-pager" role="group" aria-label="Page to preview">
                <button type="button" class="pp-step" aria-label="Previous page" title="Previous page" disabled={atFirst} onclick={handlePrev}>
                    <lightning-icon icon-name="utility:chevronleft" size="xx-small" alternative-text=""></lightning-icon>
                </button>
                <template lwc:if={usePills}>
                    <template for:each={pills} for:item="p">
                        <button key={p.key} type="button" class={p.cls} aria-current={p.ariaCurrent} aria-label={p.ariaLabel} title={p.title}
                            data-key={p.key} onclick={handlePill}>{p.number}</button>
                    </template>
                </template>
                <template lwc:else>
                    <select class="slds-select pp-select" aria-label="Page to preview" onchange={handlePage}>
                        <template for:each={options} for:item="o">
                            <option key={o.key} value={o.key} selected={o.selected}>{o.text}</option>
                        </template>
                    </select>
                </template>
                <button type="button" class="pp-step" aria-label="Next page" title="Next page" disabled={atLast} onclick={handleNext}>
                    <lightning-icon icon-name="utility:chevronright" size="xx-small" alternative-text=""></lightning-icon>
                </button>
            </div>
            <span class="pp-current" title={currentTitle}>
                <template lwc:if={usePills}><span class="pp-name">{currentName}</span></template>
                <template lwc:else><span class="pp-position">{position}</span></template>
                <template lwc:if={currentHidden}><span class="pp-hidden-tag">Hidden by a rule</span></template>
            </span>
        </template>
        <lightning-input type="toggle" class="pp-check" label="Check required fields" checked={checkRequired}
            message-toggle-active="" message-toggle-inactive="" onchange={handleCheck}></lightning-input>
    </div>
</template>
