<template>
    <div class="home">
        <header class="home-head">
            <div class="home-heading">
                <h1 class="home-title">JForm</h1>
                <p class="home-sub">Build a form, publish it to your site or any website, and collect responses as Salesforce records.</p>
                <div class="home-actions">
                    <lightning-button variant={newFormVariant} label="New form" icon-name="utility:add" onclick={handleNewForm}></lightning-button>
                    <lightning-button label="All forms" icon-name="utility:list" onclick={handleAllForms}></lightning-button>
                </div>
            </div>

            <!-- A form page turning into a Salesforce record: what JForm does, at a glance -->
            <div class="home-art" aria-hidden="true">
                <div class="art-back"></div>
                <div class="art-form">
                    <div class="art-row">
                        <span class="art-step">Step 2 of 3</span>
                        <span class="art-live"><span class="art-dot"></span>Live</span>
                    </div>
                    <div class="art-progress"><div class="art-progress-fill"></div></div>
                    <div class="art-label">Patient status</div>
                    <div class="art-choices">
                        <div class="art-choice art-choice-on"><span class="art-radio art-radio-on"></span>New</div>
                        <div class="art-choice"><span class="art-radio"></span>Returning</div>
                    </div>
                    <div class="art-label">Email</div>
                    <div class="art-input">jordan@example.com</div>
                    <div class="art-next"><span>Next</span></div>
                </div>
                <template lwc:if={agentInstalled}>
                    <div class="art-badge">
                        <lightning-icon icon-name="utility:einstein" size="x-small" alternative-text="" class="art-badge-icon"></lightning-icon>
                        Drafted by Agentforce
                    </div>
                </template>
                <svg class="art-arrow" width="34" height="24" viewBox="0 0 34 24" fill="none">
                    <path d="M2 12h26" stroke-dasharray="4 4"></path>
                    <path d="M24 6l6 6-6 6"></path>
                </svg>
                <div class="art-record">
                    <div class="art-record-head">
                        <lightning-icon icon-name="standard:lead" size="small" alternative-text=""></lightning-icon>
                        <span class="art-record-titles">
                            <span class="art-record-type">LEAD</span>
                            <span class="art-record-name">Jordan Lee</span>
                        </span>
                    </div>
                    <span class="art-record-note">
                        <lightning-icon icon-name="utility:check" size="xx-small" alternative-text="" class="art-check"></lightning-icon>
                        From a response
                    </span>
                </div>
            </div>
        </header>

        <template lwc:if={error}>
            <div class="home-alert" role="alert">{error}</div>
        </template>
        <template lwc:if={setupPending}>
            <div class="home-setup" role="status">
                <lightning-icon icon-name="utility:setup" size="small" alternative-text=""></lightning-icon>
                <div class="home-setup-text">
                    <strong>Finish setting up JForm.</strong>
                    <span>{setupText}</span>
                </div>
                <lightning-button variant="brand" label="Open Setup" onclick={handleOpenSetup}></lightning-button>
            </div>
        </template>

        <template lwc:if={hasAnyForm}>
            <section class="home-stats" aria-label="Overview">
                <template for:each={stats} for:item="s">
                    <div key={s.key} class={s.cls}>
                        <span class="stat-value">{s.value}</span>
                        <span class="stat-label">{s.label}</span>
                        <span class="stat-hint">{s.hint}</span>
                    </div>
                </template>
            </section>
        </template>

        <div class="home-grid">
            <template lwc:if={hasAnyForm}>
                <section class="home-card" aria-labelledby="recent-title">
                    <div class="card-head">
                        <h2 id="recent-title" class="card-title">Recent forms</h2>
                        <div class="card-head-actions">
                            <lightning-button-icon icon-name="utility:refresh" variant="bare" alternative-text="Refresh" title="Refresh" onclick={handleRefresh}></lightning-button-icon>
                            <button type="button" class="link" onclick={handleAllForms}>All forms</button>
                        </div>
                    </div>
                    <template lwc:if={loading}>
                        <div class="home-loading"><lightning-spinner alternative-text="Loading" size="small"></lightning-spinner></div>
                    </template>
                    <template lwc:elseif={hasForms}>
                        <ul class="form-list">
                            <template for:each={recent} for:item="f">
                                <li key={f.id}>
                                    <button type="button" class={f.rowClass} data-id={f.id} disabled={f.disabled} aria-busy={f.opening} onclick={handleOpenForm}>
                                        <span class="form-name">{f.name}</span>
                                        <span class={f.statusClass}>{f.statusLabel}</span>
                                        <span class="form-meta">{f.responseText}</span>
                                        <template lwc:if={f.opening}>
                                            <span class="form-opening" role="status"><span class="form-spinner" aria-hidden="true"></span>Opening…</span>
                                        </template>
                                        <template lwc:else>
                                            <span class="form-date" title={f.lastModifiedFull}>{f.lastModifiedText}</span>
                                        </template>
                                    </button>
                                </li>
                            </template>
                        </ul>
                    </template>
                    <template lwc:else>
                        <div class="home-empty">
                            <p>No forms yet.</p>
                            <p class="home-muted">{emptyHint}</p>
                        </div>
                    </template>
                </section>
            </template>
            <template lwc:else>
                <section class="home-card home-first" aria-labelledby="first-title">
                    <h2 id="first-title" class="home-first-title">Create your first form</h2>
                    <p class="home-muted">{emptyHint}</p>
                    <ol class="home-first-steps">
                        <li>Name the form and choose the records responses create, for example Leads. Their required fields are added for you.</li>
                        <li>Add questions from the palette, set rules in Logic, then pick a look and try the form in Design &amp; preview.</li>
                        <li>Publish, then send the link, embed the form on a website or print its QR code.</li>
                    </ol>
                    <div class="home-first-actions">
                        <lightning-button variant={newFormVariant} label="New form" icon-name="utility:add" onclick={handleNewForm}></lightning-button>
                    </div>
                </section>
            </template>

            <div class="home-side">
                <template lwc:if={agentInstalled}>
                    <c-jform-ask-agent latest-form-name={latestFormName}></c-jform-ask-agent>
                </template>
                <section class="home-card">
                    <h2 class="card-title">Where a form can go</h2>
                    <ul class="howto">
                        <li><strong>Public link.</strong> Publish, then copy the link from Share.</li>
                        <li><strong>Experience Cloud.</strong> Add the JForm Renderer component to any site page.</li>
                        <li><strong>Any website.</strong> Paste the embed snippet from Share; it resizes to fit.</li>
                        <template lwc:if={agentInstalled}>
                            <li><strong>Agentforce.</strong> Ask an agent with the JForm Form Builder subagent to find, copy, edit and publish forms.</li>
                        </template>
                    </ul>
                </section>
            </div>
        </div>
    </div>
</template>
